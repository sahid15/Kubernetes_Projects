apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: carvedrock-catalog
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ps-interactive/lab_gitops-for-progressive-delivery
    targetRevision: HEAD
    path: catalog-app
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true